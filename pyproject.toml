[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrc-engine"
version = "0.1.0"
description = "Hardware-agnostic quantum reservoir computing reference library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mohammed El Azhar" }
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer>=0.13"]
perceval = ["perceval-quandela>=0.11"]
dynamiqs = ["dynamiqs>=0.3"]
all = [
  "qiskit>=1.0",
  "qiskit-aer>=0.13",
  "perceval-quandela>=0.11",
  "dynamiqs>=0.3"
]
dev = ["pytest>=8.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["qrc_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
